name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

jobs:
  # Each check is its own job so branch protection can require each one by name.
  # The step runs exactly the npm script the README documents. No `|| true`, no
  # `continue-on-error`, no pipes: a failing command must fail the job.
  check:
    name: check (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, "format:check", typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  # The nine sandbox minimums (brief section 5, PA#3 rubric criterion 2): each attack in
  # tests/sandbox/attacks/ runs through the real sandbox, on every pull request and on
  # the pa3 tag. The image is built from docker/sandbox/ alone, so nothing else of the
  # repository (and never a .env) can be inside it.
  sandbox:
    name: sandbox (nine attacks, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANDBOX_TESTS: "1"
      SANDBOX_IMAGE: leetkob-sandbox:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build --tag "$SANDBOX_IMAGE" docker/sandbox
      - run: npm run test:sandbox

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
