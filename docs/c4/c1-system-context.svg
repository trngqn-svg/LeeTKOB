<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">LeeTKOB: System Context</title>
<desc id="d">System context diagram of LeeTKOB: students, TAs, admins and the lecturer use the system; it calls the Google Gemini API and is built and tested by GitHub Actions.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1280" height="860" fill="#FFFFFF"/>
<text x="40" y="36" font-size="22" font-weight="700" fill="#111" text-anchor="start">LeeTKOB: System Context</text>
<text x="40" y="58" font-size="13" font-weight="400" fill="#555" text-anchor="start">C4 level 1. Who uses LeeTKOB and which outside systems it depends on. Intended design for PA#3; today the repository has only the API skeleton.</text>
<rect x="40" y="100" width="250" height="150" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/><circle cx="165" cy="100" r="22" fill="#08427B" stroke="#052E56" stroke-width="2"/><text x="165" y="138" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Student</text><text x="165" y="156" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Person]</text><text x="165" y="180" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Submits C++ solutions to a lab</text><text x="165" y="196" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">and sees the judge result. After</text><text x="165" y="212" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">publishing: marks and appeals.</text><rect x="350" y="100" width="250" height="150" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/><circle cx="475" cy="100" r="22" fill="#08427B" stroke="#052E56" stroke-width="2"/><text x="475" y="138" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Teaching assistant (TA)</text><text x="475" y="156" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Person]</text><text x="475" y="180" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Teaches one class. Creates labs,</text><text x="475" y="196" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">tests and constraints with their</text><text x="475" y="212" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">deductions, reviews verdicts,</text><text x="475" y="228" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">presses Publish.</text><rect x="660" y="100" width="250" height="150" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/><circle cx="785" cy="100" r="22" fill="#08427B" stroke="#052E56" stroke-width="2"/><text x="785" y="138" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Admin</text><text x="785" y="156" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Person]</text><text x="785" y="180" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Manages accounts and classes.</text><text x="785" y="196" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Does not publish marks.</text><rect x="970" y="100" width="250" height="150" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/><circle cx="1095" cy="100" r="22" fill="#08427B" stroke="#052E56" stroke-width="2"/><text x="1095" y="138" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lecturer</text><text x="1095" y="156" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Person]</text><text x="1095" y="180" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Runs the checker command on the</text><text x="1095" y="196" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">dev and held-out datasets and</text><text x="1095" y="212" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">scores the predictions with</text><text x="1095" y="228" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">eval.mjs.</text><rect x="40" y="430" width="1200" height="150" rx="8" fill="#1168BD" stroke="#0B4884" stroke-width="2"/><text x="640" y="456" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">LeeTKOB</text><text x="640" y="474" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Software System]</text><text x="640" y="498" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Judges C++ submissions in a sandbox, then checks each Accepted one against the lab's constraints: hard rules first, then a model. The verdicts, with evidence lines, go only</text><text x="640" y="514" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">to the TA's review queue. Marks reach students only after the TA has reviewed them and pressed Publish.</text><rect x="140" y="690" width="400" height="110" rx="8" fill="#6B6B6B" stroke="#4A4A4A" stroke-width="2"/><text x="340" y="716" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLM provider: Google Gemini API</text><text x="340" y="734" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[External System]</text><text x="340" y="758" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Judges the semantic constraints. Returns pass,</text><text x="340" y="774" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">violation or unsure with evidence lines. Never sets a</text><text x="340" y="790" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">deduction.</text><rect x="740" y="690" width="400" height="110" rx="8" fill="#6B6B6B" stroke="#4A4A4A" stroke-width="2"/><text x="940" y="716" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">GitHub and GitHub Actions</text><text x="940" y="734" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[External System]</text><text x="940" y="758" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Hosts the repository. Runs lint, format, type check,</text><text x="940" y="774" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">tests, secret scan and the sandbox attack tests on</text><text x="940" y="790" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">every pull request.</text><polyline points="165,250 165,430" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><polyline points="475,250 475,430" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><polyline points="785,250 785,430" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><polyline points="1095,250 1095,430" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="175" y="332" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Submits code, sees</text><text x="175" y="348" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">the result [HTTPS, JSON]</text><text x="485" y="332" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Creates labs, reviews verdicts,</text><text x="485" y="348" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">publishes marks [HTTPS, JSON]</text><text x="795" y="332" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Manages accounts</text><text x="795" y="348" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">and classes [HTTPS, JSON]</text><text x="1105" y="332" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Runs the checker on a</text><text x="1105" y="348" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">dataset and scores it</text><polyline points="340,580 340,690" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="350" y="624" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Sends the statement, one constraint and the code</text><text x="350" y="640" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">without comments or identity [HTTPS]</text><polyline points="940,690 940,580" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="950" y="624" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Builds and tests every change</text><text x="950" y="640" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">[GitHub Actions]</text><rect x="40" y="828" width="26" height="16" rx="3" fill="#08427B" stroke="#052E56" stroke-width="1.6"/><text x="76" y="840.5" font-size="12" font-weight="400" fill="#333" text-anchor="start">Person</text><rect x="150" y="828" width="26" height="16" rx="3" fill="#1168BD" stroke="#0B4884" stroke-width="1.6"/><text x="186" y="840.5" font-size="12" font-weight="400" fill="#333" text-anchor="start">LeeTKOB (system in focus)</text><rect x="390" y="828" width="26" height="16" rx="3" fill="#6B6B6B" stroke="#4A4A4A" stroke-width="1.6"/><text x="426" y="840.5" font-size="12" font-weight="400" fill="#333" text-anchor="start">External system</text><text x="1240" y="840" font-size="11" font-weight="400" fill="#777" text-anchor="end">C4 level 1: System Context</text>
</svg>
