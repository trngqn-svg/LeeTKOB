name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

jobs:
  # Each check is its own job so branch protection can require each one by name.
  # The step runs exactly the npm script the README documents. No `|| true`, no
  # `continue-on-error`, no pipes: a failing command must fail the job.
  check:
    name: check (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, "format:check", typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  # The nine sandbox minimums (brief section 5, PA#3 rubric criterion 2): each attack in
  # tests/sandbox/attacks/ runs through the real sandbox, on every pull request and on
  # the pa3 tag. The image is built from docker/sandbox/ alone, so nothing else of the
  # repository (and never a .env) can be inside it.
  sandbox:
    name: sandbox (nine attacks, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANDBOX_TESTS: "1"
      SANDBOX_IMAGE: leetkob-sandbox:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build --tag "$SANDBOX_IMAGE" docker/sandbox
      - run: npm run test:sandbox

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Task L4: build the checker image and run it with MODEL_OFF=1 and --network none
  # on both leetkob-eval and eval-own. Fails on eval.mjs exit 2 or any wrongful deduction.
  checker:
    name: checker (MODEL_OFF=1, --network none, eval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build --file docker/checker/Dockerfile --tag leetkob-checker:ci .
      - run: |
          OUT_DIR="$(mktemp -d)"
          chmod 777 "$OUT_DIR"
          docker run --rm --network none -e MODEL_OFF=1 \
            -v "$PWD/leetkob-eval:/data:ro" -v "$OUT_DIR:/out" \
            leetkob-checker:ci --data /data --output /out/predictions.jsonl
          npx tsx src/checker/eval-gate.ts \
            --data leetkob-eval \
            --predictions "$OUT_DIR/predictions.jsonl" \
            --json "$OUT_DIR/summary.json"
          docker run --rm --network none -e MODEL_OFF=1 \
            -v "$PWD/eval-own:/data:ro" -v "$OUT_DIR:/out" \
            leetkob-checker:ci --data /data --output /out/own-predictions.jsonl
          npx tsx src/checker/eval-gate.ts \
            --data eval-own \
            --predictions "$OUT_DIR/own-predictions.jsonl" \
            --json "$OUT_DIR/own-summary.json"
