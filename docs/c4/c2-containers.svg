<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1110" width="1500" height="1110" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">LeeTKOB: Containers</title>
<desc id="d">Container diagram of LeeTKOB: an API server and a separate judge worker share a database; the worker runs submissions in a Docker sandbox and asks the Google Gemini API; a checker command scores a dataset.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1500" height="1110" fill="#FFFFFF"/>
<text x="40" y="36" font-size="22" font-weight="700" fill="#111" text-anchor="start">LeeTKOB: Containers</text>
<text x="40" y="58" font-size="13" font-weight="400" fill="#555" text-anchor="start">C4 level 2. The deployable parts inside LeeTKOB and how they talk. Intended design for PA#3; the legend shows what is built today.</text>
<rect x="95" y="100" width="230" height="120" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/><circle cx="210" cy="100" r="22" fill="#08427B" stroke="#052E56" stroke-width="2"/><text x="210" y="138" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Student</text><text x="210" y="156" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Person]</text><text x="210" y="180" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Submits code and sees</text><text x="210" y="196" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">results.</text><rect x="395" y="100" width="230" height="120" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/><circle cx="510" cy="100" r="22" fill="#08427B" stroke="#052E56" stroke-width="2"/><text x="510" y="138" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">TA</text><text x="510" y="156" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Person]</text><text x="510" y="180" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Creates labs, reviews</text><text x="510" y="196" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">verdicts, publishes.</text><rect x="695" y="100" width="230" height="120" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/><circle cx="810" cy="100" r="22" fill="#08427B" stroke="#052E56" stroke-width="2"/><text x="810" y="138" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Admin</text><text x="810" y="156" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Person]</text><text x="810" y="180" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Manages accounts and classes.</text><rect x="1175" y="100" width="230" height="120" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/><circle cx="1290" cy="100" r="22" fill="#08427B" stroke="#052E56" stroke-width="2"/><text x="1290" y="138" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lecturer</text><text x="1290" y="156" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Person]</text><text x="1290" y="180" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Runs the checker on a</text><text x="1290" y="196" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">dataset.</text><rect x="40" y="330" width="1420" height="600" rx="10" fill="none" stroke="#7A7A7A" stroke-width="1.6" stroke-dasharray="9 6"/><text x="60" y="356" font-size="16" font-weight="700" fill="#333" text-anchor="start">LeeTKOB</text><text x="60" y="374" font-size="12" font-weight="400" fill="#555" text-anchor="start">[Software System boundary]</text><rect x="440" y="400" width="360" height="175" rx="8" fill="#2F78C4" stroke="#1F5A98" stroke-width="2"/><text x="620" y="426" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">API server</text><text x="620" y="444" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[Container: Node.js 22, TypeScript, Fastify 5]</text><text x="620" y="468" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Accounts and roles, labs, submissions, the TA's</text><text x="620" y="484" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">review queue and Publish. JSON over HTTPS. Every</text><text x="620" y="500" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">error is application/problem+json.</text><text x="620" y="548" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Today: GET /health and POST /labs/{labId}/publish, with</text><text x="620" y="563" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">demo tokens.</text><rect x="699" y="408" width="93" height="18" rx="9" fill="#FFFFFF"/><text x="745.5" y="421" font-size="10" font-weight="700" fill="#1F5A98" text-anchor="middle">PARTLY BUILT</text><rect x="1000" y="400" width="380" height="175" rx="8" fill="#EAF3FC" stroke="#2F78C4" stroke-width="2" stroke-dasharray="7 5"/><text x="1190" y="426" font-size="16" font-weight="700" fill="#0B2E59" text-anchor="middle">Database</text><text x="1190" y="444" font-size="12" font-weight="400" fill="#0B2E59" text-anchor="middle" font-style="italic">[Container: SQLite file, proposed]</text><text x="1190" y="468" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">Users, classes, labs, submissions, the job queue,</text><text x="1190" y="484" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">verdicts, review items, publications and idempotency</text><text x="1190" y="500" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">keys.</text><text x="1190" y="563" font-size="12" font-weight="400" fill="#0B2E59" text-anchor="middle" font-style="italic">Today: in-memory maps in src/store.ts.</text><rect x="1311" y="408" width="61" height="18" rx="9" fill="#2F78C4"/><text x="1341.5" y="421" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLANNED</text><rect x="440" y="680" width="360" height="175" rx="8" fill="#EAF3FC" stroke="#2F78C4" stroke-width="2" stroke-dasharray="7 5"/><text x="620" y="706" font-size="16" font-weight="700" fill="#0B2E59" text-anchor="middle">Judge worker</text><text x="620" y="724" font-size="12" font-weight="400" fill="#0B2E59" text-anchor="middle" font-style="italic">[Container: Node.js process, separate from the API]</text><text x="620" y="748" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">Takes a queued submission, compiles and runs it</text><text x="620" y="764" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">in the sandbox, applies the hard rules, then asks</text><text x="620" y="780" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">the model about the semantic constraints. Each</text><text x="620" y="796" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">verdict is stored once.</text><rect x="731" y="688" width="61" height="18" rx="9" fill="#2F78C4"/><text x="761.5" y="701" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLANNED</text><rect x="60" y="680" width="270" height="175" rx="8" fill="#EAF3FC" stroke="#2F78C4" stroke-width="2" stroke-dasharray="7 5"/><text x="195" y="706" font-size="16" font-weight="700" fill="#0B2E59" text-anchor="middle">Sandbox</text><text x="195" y="724" font-size="12" font-weight="400" fill="#0B2E59" text-anchor="middle" font-style="italic">[Container: Docker, g++]</text><text x="195" y="748" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">One short-lived container per run.</text><text x="195" y="764" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">No network; CPU, time, memory,</text><text x="195" y="780" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">process and output limits;</text><text x="195" y="796" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">non-root; no host mounts; no</text><text x="195" y="812" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">secrets.</text><rect x="261" y="688" width="61" height="18" rx="9" fill="#2F78C4"/><text x="291.5" y="701" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLANNED</text><rect x="1000" y="680" width="380" height="175" rx="8" fill="#EAF3FC" stroke="#2F78C4" stroke-width="2" stroke-dasharray="7 5"/><text x="1190" y="706" font-size="16" font-weight="700" fill="#0B2E59" text-anchor="middle">Checker command</text><text x="1190" y="724" font-size="12" font-weight="400" fill="#0B2E59" text-anchor="middle" font-style="italic">[Container: Node.js CLI with a Dockerfile]</text><text x="1190" y="748" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">Dataset folder in, predictions.jsonl out. With</text><text x="1190" y="764" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">MODEL_OFF=1 it runs the hard rules only and opens no</text><text x="1190" y="780" font-size="13" font-weight="400" fill="#0B2E59" text-anchor="middle">network connection.</text><rect x="1311" y="688" width="61" height="18" rx="9" fill="#2F78C4"/><text x="1341.5" y="701" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLANNED</text><rect x="520" y="1000" width="400" height="85" rx="8" fill="#6B6B6B" stroke="#4A4A4A" stroke-width="2"/><text x="720" y="1026" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLM provider: Google Gemini API</text><text x="720" y="1044" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">[External System, HTTPS]</text><text x="720" y="1068" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">Judges the semantic constraints.</text><polyline points="210,220 470,400" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="352" y="290" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Submits code,</text><text x="352" y="306" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">sees results</text><polyline points="510,220 620,400" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="580" y="300" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Creates labs, reviews,</text><text x="580" y="316" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">publishes marks</text><polyline points="810,220 770,400" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="800" y="300" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Manages accounts</text><polyline points="800,487 1000,487" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="900" y="456" font-size="12" font-weight="400" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Reads and writes,</text><text x="900" y="472" font-size="12" font-weight="400" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">queues submissions</text><polyline points="800,715 1040,577" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="815" y="612" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Claims jobs,</text><text x="815" y="628" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">stores verdicts</text><polyline points="440,767 330,767" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="385" y="732" font-size="12" font-weight="400" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">docker run,</text><text x="385" y="748" font-size="12" font-weight="400" fill="#222" text-anchor="middle" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">code on stdin</text><polyline points="600,855 640,1000" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="662" y="948" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Statement, one constraint</text><text x="662" y="964" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">and code without comments</text><polyline points="1190,855 905,1000" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="1078" y="884" font-size="12" font-weight="400" fill="#222" text-anchor="end" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Same call, skipped</text><text x="1078" y="900" font-size="12" font-weight="400" fill="#222" text-anchor="end" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">when MODEL_OFF=1</text><polyline points="1290,220 1290,300 1420,300 1420,767 1382,767" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/><text x="1305" y="266" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Runs it on a dataset,</text><text x="1305" y="282" font-size="12" font-weight="400" fill="#222" text-anchor="start" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">scores with eval.mjs</text><text x="60" y="915" font-size="12" font-weight="400" fill="#555" text-anchor="start" font-style="italic">The worker and the checker share the same hard rules and model client.</text><rect x="40" y="985" width="440" height="110" rx="6" fill="#FFFFFF" stroke="#BBB"/><text x="56" y="1006" font-size="12" font-weight="700" fill="#333" text-anchor="start">Legend</text><rect x="56" y="1016" width="26" height="16" rx="3" fill="#08427B" stroke="#052E56" stroke-width="1.6"/><text x="92" y="1028.5" font-size="12" font-weight="400" fill="#333" text-anchor="start">Person</text><rect x="56" y="1040" width="26" height="16" rx="3" fill="#2F78C4" stroke="#1F5A98" stroke-width="1.6"/><text x="92" y="1052.5" font-size="12" font-weight="400" fill="#333" text-anchor="start">Container that exists in the repository today</text><rect x="56" y="1064" width="26" height="16" rx="3" fill="#EAF3FC" stroke="#2F78C4" stroke-width="1.6" stroke-dasharray="7 5"/><text x="92" y="1076.5" font-size="12" font-weight="400" fill="#333" text-anchor="start">Container planned for PA#3 (not built yet)</text><rect x="270" y="1016" width="26" height="16" rx="3" fill="#6B6B6B" stroke="#4A4A4A" stroke-width="1.6"/><text x="306" y="1028.5" font-size="12" font-weight="400" fill="#333" text-anchor="start">External system</text><text x="1460" y="1100" font-size="11" font-weight="400" fill="#777" text-anchor="end">C4 level 2: Containers</text>
</svg>
