name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

jobs:
  # Each check is its own job so branch protection can require each one by name.
  # The step runs exactly the npm script the README documents. No `|| true`, no
  # `continue-on-error`, no pipes: a failing command must fail the job.
  check:
    name: check (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, "format:check", typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
